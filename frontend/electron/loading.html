<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>R6 Replay Lab</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0d1117;
        color: #e6edf3;
        font: 14px/1.5 "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .brand span {
        color: #ff8a3d;
      }
      .note {
        color: #8b98a9;
        font-size: 12px;
      }
      .bar {
        width: 190px;
        height: 3px;
        border-radius: 2px;
        background: #263041;
        overflow: hidden;
      }
      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #ff8a3d;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="brand">R6 <span>Replay Lab</span></div>
    <div class="bar"><i></i></div>
    <div class="note">Levantando el backend...</div>
  </body>
</html>
