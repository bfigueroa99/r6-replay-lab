# Lo mismo que `scripts/check.ps1`, para cuando el repo tenga un remoto.
# Hoy no corre en ningun lado: el proyecto vive en un PC. Queda listo para no
# tener que escribirlo con apuro el dia que se suba a GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check backend
      - name: tests
        working-directory: backend
        # sin .env el settings usa los defaults, que es justo lo que hay que probar
        run: python manage.py test tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: tests
        run: npm test
        working-directory: frontend
      - name: build
        run: npm run build
        working-directory: frontend
