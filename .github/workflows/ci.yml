# Lo mismo que `scripts/check.ps1`: lint, tests, build y end to end.
#
# El e2e es el paso que ve la app de verdad (Django sirviendo el build, manejado
# con Chromium). Vale igual en local que aca: mientras Actions no funcione, el
# `check.ps1` de la maquina es la unica verificacion que corre.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check backend
      - name: tests
        working-directory: backend
        # sin .env el settings usa los defaults, que es justo lo que hay que probar
        run: python manage.py test tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: tests
        run: npm test
        working-directory: frontend
      - name: build
        run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: navegador
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: e2e
        # compila el front y levanta Django con una base sembrada aparte
        # (ver frontend/e2e/servidor.js); no toca ninguna base real
        run: npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
