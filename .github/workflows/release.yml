# Arma el .exe en un runner de Windows y lo cuelga en GitHub Releases.
#
# Dos formas de dispararlo:
#   - push de un tag `v*` (ej. `git tag v0.1.0 && git push origin v0.1.0`):
#     compila y publica una Release con el instalador de un clic.
#   - "Run workflow" a mano desde la pestana Actions: compila y deja los .exe
#     como artefacto del run, sin publicar nada. Sirve para probar una rama.
#
# Corre exactamente `scripts\package.ps1`, el mismo script que se usa en el PC:
# si el workflow arma el .exe, el script tambien, y al reves.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: La version del tag tiene que ser la de package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content frontend/package.json | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "El tag dice $tag pero frontend/package.json dice $pkg. Sube la version y vuelve a taggear."
          }

      - name: Entorno virtual con las herramientas de empaquetado
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Tests del backend
        working-directory: backend
        shell: pwsh
        run: ..\.venv\Scripts\python.exe manage.py test tests

      - name: Instalador
        shell: pwsh
        env:
          # no hay certificado de firma: que electron-builder ni lo busque
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: .\scripts\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: R6ReplayLab-windows
          path: packaging/installer/R6ReplayLab-*-setup.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/installer/R6ReplayLab-*-setup.exe
          generate_release_notes: true
          body: |
            **Para usarla:** descarga `R6ReplayLab-*-setup.exe` y hazle doble clic.
            Se instala sin preguntar nada, deja un acceso directo y abre la app.
            La carpeta de replays, la importacion automatica y las copias se manejan en Ajustes.

            El ejecutable no esta firmado: la primera vez Windows muestra SmartScreen
            (*Mas informacion* -> *Ejecutar de todas formas*).
